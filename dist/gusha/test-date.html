<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1430"><title>Кофейная гуща · дата рождения</title>
<link rel="preload" href="/assets/cormorant-garamond.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:Cormorant;src:url(/assets/cormorant-garamond.woff2) format('woff2');font-weight:300 700;font-display:swap}
:root{color-scheme:dark;--deep:#0b1430;--sand:#e8d2aa;--gold:#f0d79a;--muted:#7d88ab}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--deep);color:var(--sand);
  font:400 12px/1.4 -apple-system,'SF Pro Text',Arial,sans-serif;
  background-image:
    radial-gradient(126% 80% at 50% 4%,#1c2a58 0%,#16204a 36%,#0d1533 68%,#080d22 100%),
    radial-gradient(92% 34% at 50% 104%,rgba(196,140,64,.24) 0%,rgba(122,80,42,.09) 44%,rgba(10,17,40,0) 74%);
  background-blend-mode:normal,screen}
#sand{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;z-index:1}
#screen{position:fixed;inset:0;z-index:3;pointer-events:none}
#hud{position:fixed;top:max(6px,env(safe-area-inset-top));left:10px;z-index:4;color:var(--muted);
  font-variant-numeric:tabular-nums;letter-spacing:.06em;opacity:.55;margin:0}
#hud b{color:var(--gold);font-weight:400}
</style></head><body>
<canvas id="sand"></canvas>
<div id="screen"></div>
<p id="hud"><b id="fps">—</b> fps · <span id="dbg">—</span></p>
<script type="module">
import { createSand } from '/gusha/sand.js';
import * as date from '/gusha/screens/date.js';

const canvas = document.getElementById('sand');
const sand = createSand(canvas, { count: 46000 });
const session = {};
const ctx = {
  sand, root: document.getElementById('screen'), session,
  go(name) { console.log('go →', name); document.getElementById('dbg').textContent = 'go ' + name; }
};
await date.mount(ctx);

const elFps = document.getElementById('fps'), elDbg = document.getElementById('dbg');
let last = performance.now(), acc = 0, frames = 0, hudT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = (now - last) / 1000; last = now;
  if (document.hidden || window.paused) return;
  sand.tick(dt); sand.draw();
  acc += dt; frames++; hudT += dt;
  if (hudT > .5) {
    elFps.textContent = (frames / acc).toFixed(0);
    const d = date.debug();
    if (d) elDbg.textContent = `${d.sel.d}.${d.sel.m}.${d.sel.y} · ${d.sign} · живых ${d.live.join('/')} · тает ${d.dissolving}`;
    acc = 0; frames = 0; hudT = 0;
  }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) last = performance.now(); });
requestAnimationFrame(frame);

// крюки QA: точный кадр вместо «когда успеет»
window.sand = sand; window.date = date; window.session = session;
window.paused = false;
window.step = (seconds, fps = 60) => {
  const dt = 1 / fps;
  for (let i = 0; i < Math.round(seconds * fps); i++) { date.advance(dt); sand.tick(dt); }
  sand.draw();
};
window.freeze = v => { window.paused = !!v; date.pause(!!v); };
</script>
</body></html>
